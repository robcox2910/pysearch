site_name: PySearch
site_url: https://robcox2910.github.io/pysearch/
site_description: "Build your own search engine in Python: tokenizing, an inverted index, TF-IDF ranking and boolean queries, explained for learners."
repo_url: https://github.com/robcox2910/pysearch
repo_name: robcox2910/pysearch

# theme:start
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.highlight

# Social cards need cairo, so they are off unless SOCIAL_CARDS is set (the
# shared docs workflow sets it). A repo must not add its own plugins key.
plugins:
  - search
  - social:
      enabled: !ENV [SOCIAL_CARDS, false]
# theme:end

exclude_docs: |
  superpowers/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables

nav:
  - Home: index.md
  - Inverted Index: concepts/inverted-index.md
  - Query Parser: concepts/query-parser.md
  - Saving Your Index: concepts/saving.md
  - TF-IDF: concepts/tfidf.md
  - Tokenizer: concepts/tokenizer.md
  - Property Testing: property-testing.md
  # series-nav:start
  - The series:
      - Series home: https://robcox2910.github.io/
      - PyOS: https://robcox2910.github.io/py-os/
      - Pebble: https://robcox2910.github.io/pebble-lang/
      - PyDB: https://robcox2910.github.io/pydb/
      - PyKV: https://robcox2910.github.io/pykv/
      - PyDocDB: https://robcox2910.github.io/pydoc-db/
      - PyGraphDB: https://robcox2910.github.io/pygraphdb/
      - PyTSDB: https://robcox2910.github.io/pytsdb/
      - PyVecDB: https://robcox2910.github.io/pyvecdb/
      - PyColDB: https://robcox2910.github.io/pycoldb/
      - PyCrypt: https://robcox2910.github.io/pycrypt/
      - PyNet: https://robcox2910.github.io/pynet/
      - PyWeb: https://robcox2910.github.io/pyweb/
      - PyGit: https://robcox2910.github.io/pygit/
      - "[You are here] PySearch": https://robcox2910.github.io/pysearch/
      - PyMQ: https://robcox2910.github.io/pymq/
      - PyLLM: https://robcox2910.github.io/pyllm/
      - PyStack: https://robcox2910.github.io/pystack/
